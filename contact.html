<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <header>
        <h1 id="title">Contact</h1>
        <nav>
            <a href="index.html">WhoAmI</a>
            <a href="pagina2.html">Projecten</a>
            <a href="pagina3.html">Blog</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Neem contact op</h2>
            <form id="contact-form" novalidate>

                <label for="naam">Naam</label>
                <input id="naam" name="naam" required minlength="2" aria-describedby="naam-error" aria-invalid="false">
                <span id="naam-error" role="alert"></span>

                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" required aria-describedby="email-error"
                    aria-invalid="false">
                <span id="email-error" role="alert"></span>

                <label for="bericht">Bericht</label>
                <textarea id="bericht" name="bericht" required minlength="10" aria-describedby="bericht-error"
                    aria-invalid="false"></textarea>
                <span id="bericht-error" role="alert"></span>

                <button type="submit">Versturen</button>
                <div id="form-status" aria-live="polite"></div>

            </form>
        </section>
    </main>

    <footer>
        <p>Author: Jelmer van den Bos - 2026<br>
            <a href="mailto:jelmer.vandenbos2006@gmail.com">jelmer.vandenbos2006@gmail.com</a>
        </p>
    </footer>
    <script src="script.js"></script>

</body>

</html>
